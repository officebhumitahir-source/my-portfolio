<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Kindle Paper Background -->
  <rect width="800" height="600" fill="#F5F5F5"/>

  <!-- Browser Window Frame -->
  <rect x="40" y="35" width="720" height="530" rx="4" ry="4" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Chrome Browser Header / Tab Strip -->
  <rect x="40" y="35" width="720" height="48" fill="#1A1A1A"/>
  <circle cx="65" cy="59" r="5" fill="#F5F5F5" opacity="0.3"/>
  <circle cx="80" cy="59" r="5" fill="#F5F5F5" opacity="0.3"/>
  <circle cx="95" cy="59" r="5" fill="#F5F5F5" opacity="0.3"/>

  <!-- Active Browser Tabs -->
  <g transform="translate(120, 43)">
    <!-- Active Workspace Tab -->
    <rect x="0" y="0" width="165" height="40" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="2"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A" font-weight="bold">⚡ TabFlow: Dev (8)</text>

    <!-- Inactive Tab 2 -->
    <rect x="175" y="4" width="140" height="36" fill="#2A2A2A"/>
    <text x="187" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5F5F5" opacity="0.7">GitHub / Repo</text>

    <!-- Inactive Tab 3 -->
    <rect x="325" y="4" width="140" height="36" fill="#2A2A2A"/>
    <text x="337" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5F5F5" opacity="0.7">API Documentation</text>
  </g>

  <!-- Extension Badge in URL bar area -->
  <rect x="50" y="93" width="700" height="38" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="70" y="117" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A" opacity="0.6">chrome-extension://tabflow/sidepanel.html</text>
  <rect x="625" y="100" width="115" height="24" fill="#1A1A1A"/>
  <text x="682" y="116" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="middle" font-weight="bold">[MV3 // LOCAL]</text>

  <!-- Two-Column Layout: Left Viewport (Browser) + Right SidePanel (TabFlow) -->
  
  <!-- Left Column: Web Content Area -->
  <g transform="translate(50, 142)">
    <rect x="0" y="0" width="410" height="405" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Workspace Overview Header -->
    <rect x="15" y="15" width="380" height="50" fill="#EAEAEA" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="30" y="45" font-family="'JetBrains Mono', monospace" font-size="14" fill="#1A1A1A" font-weight="bold">ACTIVE WORKSPACE: [FRONTEND_CORE]</text>
    
    <!-- Tab Grid List in Browser Window -->
    <g transform="translate(15, 80)">
      <!-- Tab Item 1 -->
      <rect x="0" y="0" width="380" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
      <rect x="8" y="12" width="20" height="20" fill="#1A1A1A"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="middle" font-weight="bold">T1</text>
      <text x="38" y="27" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A" font-weight="bold">Vite Development Server (Port 5173)</text>
      <text x="365" y="27" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="end">[PINNED]</text>

      <!-- Tab Item 2 -->
      <rect x="0" y="52" width="380" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
      <rect x="8" y="64" width="20" height="20" fill="#1A1A1A"/>
      <text x="18" y="78" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="middle" font-weight="bold">T2</text>
      <text x="38" y="79" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A">TailwindCSS Documentation & Grid Utility</text>
      <text x="365" y="79" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1A1A1A" opacity="0.5" text-anchor="end">24MB RAM</text>

      <!-- Tab Item 3 -->
      <rect x="0" y="104" width="380" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
      <rect x="8" y="116" width="20" height="20" fill="#1A1A1A"/>
      <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="middle" font-weight="bold">T3</text>
      <text x="38" y="131" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A">TypeScript AST Parser & Chrome Types</text>
      <text x="365" y="131" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1A1A1A" opacity="0.5" text-anchor="end">18MB RAM</text>

      <!-- Tab Item 4 -->
      <rect x="0" y="156" width="380" height="44" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
      <rect x="8" y="168" width="20" height="20" fill="#1A1A1A"/>
      <text x="18" y="182" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" text-anchor="middle" font-weight="bold">T4</text>
      <text x="38" y="183" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1A1A1A">Chrome Storage Local Profiler Tool</text>
      <text x="365" y="183" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1A1A1A" opacity="0.5" text-anchor="end">12MB RAM</text>
    </g>

    <!-- Bottom Telemetry Banner -->
    <rect x="15" y="340" width="380" height="50" fill="#1A1A1A"/>
    <text x="30" y="362" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22C55E" font-weight="bold">MEMORY SAVINGS: ~420MB RECLAIMED</text>
    <text x="30" y="378" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F5F5F5" opacity="0.8">Zero cloud tracking. All session graphs stored in chrome.storage.local</text>
  </g>

  <!-- Right Column: TabFlow Extension SidePanel -->
  <g transform="translate(470, 142)">
    <rect x="0" y="0" width="280" height="405" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- SidePanel Header -->
    <rect x="0" y="0" width="280" height="45" fill="#242424" stroke="#333" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F5F5F5" font-weight="bold">⚡ TabFlow</text>
    <rect x="195" y="12" width="70" height="22" fill="#22C55E"/>
    <text x="230" y="27" font-family="'JetBrains Mono', monospace" font-size="10" fill="#000000" text-anchor="middle" font-weight="bold">SAVE WIN</text>

    <!-- Workspaces List in Panel -->
    <g transform="translate(15, 60)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F5F5F5" opacity="0.6">SAVED WORKSPACES (04)</text>

      <!-- Workspace Card 1 (Active) -->
      <rect x="0" y="25" width="250" height="65" fill="#2E2E2E" stroke="#22C55E" stroke-width="2"/>
      <text x="12" y="47" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" font-weight="bold">Frontend Core</text>
      <text x="12" y="65" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22C55E">● 8 TABS • SNAPSHOT #12</text>
      <rect x="195" y="40" width="45" height="24" fill="#22C55E"/>
      <text x="217" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">OPEN</text>

      <!-- Workspace Card 2 -->
      <rect x="0" y="100" width="250" height="60" fill="#242424" stroke="#444" stroke-width="1"/>
      <text x="12" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5" font-weight="bold">Data Telemetry (HRMS)</text>
      <text x="12" y="138" font-family="'JetBrains Mono', monospace" font-size="9" fill="#888">5 TABS • UPDATED 2H AGO</text>

      <!-- Workspace Card 3 -->
      <rect x="0" y="170" width="250" height="60" fill="#242424" stroke="#444" stroke-width="1"/>
      <text x="12" y="192" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5" font-weight="bold">Research & LLM Papers</text>
      <text x="12" y="208" font-family="'JetBrains Mono', monospace" font-size="9" fill="#888">12 TABS • SNAPSHOT #04</text>
    </g>

    <!-- Bottom Action Bar in Extension -->
    <g transform="translate(15, 310)">
      <rect x="0" y="0" width="250" height="32" fill="#22C55E"/>
      <text x="125" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#000000" text-anchor="middle" font-weight="bold">CLEAN DUPLICATES (3 FOUND)</text>

      <rect x="0" y="42" width="250" height="30" fill="none" stroke="#F5F5F5" stroke-width="1" opacity="0.4"/>
      <text x="125" y="62" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F5F5F5" text-anchor="middle">EXPORT JSON BACKUP (PORTABLE)</text>
    </g>
  </g>
</svg>
