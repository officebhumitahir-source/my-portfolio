<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F5F5F5"/>
  <!-- Browser Window -->
  <rect x="50" y="50" width="700" height="500" rx="4" ry="4" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="50" y1="90" x2="750" y2="90" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="80" cy="70" r="6" fill="#1A1A1A"/>
  <circle cx="100" cy="70" r="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="120" cy="70" r="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Dashboard Content -->
  <text x="80" y="140" font-family="serif" font-size="24" fill="#1A1A1A" font-weight="bold">Sales Overview</text>
  
  <!-- Bar Chart -->
  <rect x="80" y="200" width="40" height="200" fill="#1A1A1A"/>
  <rect x="150" y="150" width="40" height="250" fill="#1A1A1A" opacity="0.6"/>
  <rect x="220" y="250" width="40" height="150" fill="#1A1A1A" opacity="0.8"/>
  <rect x="290" y="100" width="40" height="300" fill="#1A1A1A"/>
  <rect x="360" y="180" width="40" height="220" fill="#1A1A1A" opacity="0.5"/>
  
  <line x1="80" y1="400" x2="650" y2="400" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Stats -->
  <rect x="500" y="150" width="200" height="100" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="520" y="190" font-family="monospace" font-size="14" fill="#1A1A1A">TOTAL SALES</text>
  <text x="520" y="230" font-family="monospace" font-size="32" fill="#1A1A1A" font-weight="bold">$12,450</text>
</svg>
